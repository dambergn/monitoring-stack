# This server block redirects all HTTP traffic to HTTPS.
server {
    listen 80;
    server_name localhost; # Or your.domain.com

    # Tell browsers to always use HTTPS
    return 301 https://$host$request_uri;
}

# This is the main server block for your application
server {
    listen 443 ssl;
    server_name localhost; # Or your.domain.com

    # --- SSL Certificate Configuration ---
    # These paths are INSIDE the container, which we'll map via volumes.
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # --- SSL Security Enhancements (Recommended) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # --- Reverse Proxy Configuration ---
    location / {
        # IMPORTANT: We use the Docker service name here, not 'localhost'.
        # 'my-app' is the name of the service in our docker-compose.yml.
        # Docker's internal DNS will resolve 'my-app' to the container's IP.
        proxy_pass http://grafana:3100;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}